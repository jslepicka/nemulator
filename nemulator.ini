;Location of arcade roms.  Each set is in its own directory here, named after the set:
;invaders, pacman, mspacmab, mspacman, mspacmnf
;A set can be kept elsewhere by giving it its own path, e.g., pacman.rom_path
arcade.rom_path = c:\roms\arcade

;
;Display
;

;x resolution for windowed mode, y resolution is computed from the aspect ratio.  0 (the
;default) uses 50% of the screen width, as does a width too wide for the screen.  Saved
;when the window is resized, and reset by settings > display > reset to defaults.
app.x = 0

;Start in fullscreen mode?  Also changed by settings > display.
app.fullscreen = true

;Image scaling sharpness, from 0.0 (soft) to 1.0 (sharp).  Also changed by settings > display.
sharpness = 0.800

;Enable scanlines.  Also changed by settings > display.
scanlines = true

;Aspect ratio lock, i.e., constrain window dimensions on resize
app.aspect_lock = true

;How emulation is paced.  Also changed by settings > general.
;  vsync - vsync on, with the audio rate adjusted to match the display.  Needs a ~60Hz display,
;          or a multiple of it (120, 180, 240), which is presented every nth refresh.
;  timer - vsync off, with frames paced by a timer: 60Hz in the menu, and the running system's
;          rate in a game.  A variable refresh rate (g-sync/freesync) display is recommended.
;A mode named here is used even if the display doesn't suit it.
;
;On a display that is not ~60Hz or a multiple of it, no setting avoids artifacts entirely: at
;144Hz, for example, a 60Hz frame lasts 2.4 refreshes, so frames are either presented when
;ready (tearing, in fullscreen) or held for an uneven number of refreshes (judder).  Setting
;the display to 60Hz - or 120Hz, where vsync holds each frame for exactly two refreshes -
;avoids this, as does a variable refresh rate display with timer mode.
sync_mode = vsync

;
;Menu
;

;Number of columns in the menu.  The number of rows is computed automatically.  Minimum is 3.
menu_columns = 8

;Preload roms for smoother scrolling when first launched.  May cause long startup delays.
preload = true

;Pause emulation when the application loses focus
app.pause_on_lost_focus = true

;Show the suspend computer option in the quit menu
show_suspend = false

;How long, in ms, start+select need to be held to show the menu in a game.  The default keeps
;it clear of games that use the combo themselves (e.g., Crystal Mines); 0 shows it immediately.
menu_delay = 333

