;Joystick mappings
;
;Type:
; 0 - Button (default)
;     Value = button number
;
; 1 - Axis
;     Check if YYYY axis is above XXXX threshold (or below XXXX threshold if XXXX is negative).
;
;     Value = 0xXXXXYYYY
;     XXXX = signed threshold %.
;     YYYY = Axis number (0 = X, 1 = Y, 2 = Z)
;
; 2 - POV Hat (D-Pad)
;     POV Hat position is measured in 100ths of degrees.  Up = 0, Right = 9000, etc.
;     Check is POV hat is between YYYY and XXXX position.
;
;     Value = 0xXXXXYYYY
;     XXXX = high position
;     YYYY = low position
;
;Examples:
;
;Xbox 360 controller (D-Pad)
;
;joy1.joy = 0
;joy1.joy.left.type = 2
;joy1.joy.left = 0x7B0C57E4
;joy1.joy.right.type = 2
;joy1.joy.right = 0x34BC1194
;joy1.joy.up.type = 2
;joy1.joy.up = 0x11947B0C
;joy1.joy.down.type = 2
;joy1.joy.down = 0x57E434BC
;joy1.joy.a = 0
;joy1.joy.a_turbo = 1
;joy1.joy.b = 2
;joy1.joy.b_turbo = 3
;joy1.joy.select = 6
;joy1.joy.start = 7
;
;Xbox 360 controller (Analog stick)
;
;joy1.joy = 0
;joy1.joy.left.type = 1
;joy1.joy.left = 0xDF00
;joy1.joy.right.type = 1
;joy1.joy.right = 0x2100
;joy1.joy.up.type = 1
;joy1.joy.up = 0xDF01
;joy1.joy.down.type = 1
;joy1.joy.down = 0x2101
;joy1.joy.a = 0
;joy1.joy.a_turbo = 1
;joy1.joy.b = 2
;joy1.joy.b_turbo = 3
;joy1.joy.select = 6
;joy1.joy.start = 7

;joy2.joy = 1
;joy2.joy.left = 0
;joy2.joy.right = 0
;joy2.joy.up = 0
;joy2.joy.down = 0
;joy2.joy.a = 0
;joy2.joy.a_turbo = 0
;joy2.joy.b = 0
;joy2.joy.b_turbo = 0
;joy2.joy.select = 0
;joy2.joy.start = 0

;Per-system input configuration
;
;Settings > input (press Esc in the game menu or in a game) saves assignments for each system at the end
;of this file, prefixed with the system: nes (NES, FDS, and NSF), gb (Game Boy and Game Boy Color),
;sms (Master System and Game Gear), genesis, tg16, pacman (all Pac-Man games), and invaders.
;Only assignments that differ from the joy1/joy2 settings above are saved; everything else uses those
;settings, which the menu never changes.  Resetting a system to defaults removes its lines.
;
;nes.joy1.a = 0x4B            keyboard key, 0 = none
;nes.joy1.joy.a.device = 0    joystick number, -1 = none
;nes.joy1.joy.a.type = 0      joystick mapping type and value, as described above
;nes.joy1.joy.a = 2

tg16.joy1.select = 0x41
tg16.joy1.start = 0x53
