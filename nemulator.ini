;nemulator configuration
;
;This file was written with every setting at its default value.  Removing a setting, or this
;whole file, restores its default.

;
;Paths
;

;Location of .nes roms (Nintendo NES)
nes.rom_path = c:\roms\nes
;Location of .ram files.  If unspecified, or the directory doesn't exist, the rom path is used.
nes.save_path = c:\roms\nes

;Location of .nsf roms (Nintendo NES)
nsf.rom_path = c:\roms\nsf
;Location of .ram files.  If unspecified, or the directory doesn't exist, the rom path is used.
nsf.save_path = c:\roms\nsf

;Location of .fds roms (Nintendo FDS)
fds.rom_path = c:\roms\fds
;Location of .ram files.  If unspecified, or the directory doesn't exist, the rom path is used.
fds.save_path = c:\roms\fds

;Location of .bin roms (Sega Genesis)
genesis.rom_path = c:\roms\genesis
;Location of .ram files.  If unspecified, or the directory doesn't exist, the rom path is used.
genesis.save_path = c:\roms\genesis

;Location of .pce roms (NEC TurboGrafx-16)
pce.rom_path = c:\roms\pce
;Location of .ram files.  If unspecified, or the directory doesn't exist, the rom path is used.
pce.save_path = c:\roms\pce

;Location of .gb roms (Nintendo Game Boy)
gb.rom_path = c:\roms\gb
;Location of .ram files.  If unspecified, or the directory doesn't exist, the rom path is used.
gb.save_path = c:\roms\gb

;Location of .gbc roms (Nintendo Game Boy Color)
gbc.rom_path = c:\roms\gbc
